<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="52x52" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>North — Black Polar</title>
    <script>try{const saved=localStorage.getItem('north-theme-v1');const legacy=localStorage.getItem('bp-theme');const theme=['light','dark','midnight'].includes(saved)?saved:(legacy==='dark'?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.classList.toggle('dark',theme==='dark'||theme==='midnight');document.documentElement.style.colorScheme=theme==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='light'}</script>
    <link rel="preload" href="/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
