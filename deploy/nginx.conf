# Server block for /etc/nginx/sites-available/blackpolar on the production VPS.
# DNS already points north.blackpolar.org to the Cloudflare-proxied origin.

server {
    listen 8080 ssl;
    server_name north.blackpolar.org;

    ssl_certificate     /etc/letsencrypt/live/blackpolar.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blackpolar.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/north/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.blackpolar.org; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.blackpolar.org" always;
}
